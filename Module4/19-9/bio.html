<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Social Bio Link Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        /* FORM */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;

            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 10px;

            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        /* PROFILE */

        .profile {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile img {
            width: 110px;
            height: 110px;

            border-radius: 50%;
            object-fit: cover;

            border: 4px solid #667eea;
        }

        .profile h2 {
            margin-top: 12px;
            color: #333;
        }

        .profile p {
            margin-top: 7px;
            color: #777;
        }

        /* SOCIAL LINKS */

        .link-card {
            display: block;

            text-decoration: none;
            color: #333;

            background: #f5f6fa;

            padding: 15px;
            margin: 12px 0;

            border-radius: 12px;

            text-align: center;
            font-weight: bold;

            transition: 0.3s;
        }

        .link-card:hover {
            background: #667eea;
            color: white;

            transform: translateY(-3px);
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .container {
                grid-template-columns: 1fr;
            }

            .box {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- ================= FORM ================= -->

        <div class="box">

            <h1>Create Your Bio</h1>

            <p class="description">
                Enter your details and see the preview instantly.
            </p>


            <label>Your Name</label>

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your name"
            >


            <label>Bio</label>

            <textarea
                id="bioInput"
                placeholder="Write something about yourself..."
            ></textarea>


            <label>Profile Image URL</label>

            <input
                type="url"
                id="imageInput"
                placeholder="https://example.com/photo.jpg"
            >


            <label>Instagram URL</label>

            <input
                type="url"
                id="instagramInput"
                placeholder="https://instagram.com/username"
            >


            <label>LinkedIn URL</label>

            <input
                type="url"
                id="linkedinInput"
                placeholder="https://linkedin.com/in/username"
            >


            <label>Spotify URL</label>

            <input
                type="url"
                id="spotifyInput"
                placeholder="https://open.spotify.com/"
            >


            <label>GitHub URL</label>

            <input
                type="url"
                id="githubInput"
                placeholder="https://github.com/username"
            >

        </div>


        <!-- ================= PREVIEW ================= -->

        <div class="box">

            <h1>Preview</h1>

            <div class="profile">

                <img
                    id="previewImage"
                    src="https://via.placeholder.com/150"
                    alt="Profile"
                >

                <h2 id="previewName">
                    Your Name
                </h2>

                <p id="previewBio">
                    Your bio will appear here
                </p>

            </div>


            <!-- Instagram -->

            <a
                id="instagramLink"
                class="link-card"
                href="#"
                target="_blank"
                style="display: none;"
            >
                📸 Instagram
            </a>


            <!-- LinkedIn -->

            <a
                id="linkedinLink"
                class="link-card"
                href="#"
                target="_blank"
                style="display: none;"
            >
                💼 LinkedIn
            </a>


            <!-- Spotify -->

            <a
                id="spotifyLink"
                class="link-card"
                href="#"
                target="_blank"
                style="display: none;"
            >
                🎵 Spotify
            </a>


            <!-- GitHub -->

            <a
                id="githubLink"
                class="link-card"
                href="#"
                target="_blank"
                style="display: none;"
            >
                💻 GitHub
            </a>

        </div>

    </div>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // NAME

        const nameInput = document.getElementById("nameInput");

        nameInput.addEventListener("input", function() {

            if (nameInput.value.trim() === "") {

                document.getElementById("previewName").textContent =
                    "Your Name";

            } else {

                document.getElementById("previewName").textContent =
                    nameInput.value;

            }

        });


        // BIO

        const bioInput = document.getElementById("bioInput");

        bioInput.addEventListener("input", function() {

            if (bioInput.value.trim() === "") {

                document.getElementById("previewBio").textContent =
                    "Your bio will appear here";

            } else {

                document.getElementById("previewBio").textContent =
                    bioInput.value;

            }

        });


        // PROFILE IMAGE

        const imageInput = document.getElementById("imageInput");

        imageInput.addEventListener("input", function() {

            if (imageInput.value.trim() !== "") {

                document.getElementById("previewImage").src =
                    imageInput.value;

            } else {

                document.getElementById("previewImage").src =
                    "https://via.placeholder.com/150";

            }

        });


        // SOCIAL LINKS

        function updateLink(inputId, linkId) {

            const input = document.getElementById(inputId);

            const link = document.getElementById(linkId);


            input.addEventListener("input", function() {

                const url = input.value.trim();


                if (url === "") {

                    // Hide card if input is empty

                    link.style.display = "none";

                } else {

                    // Show card

                    link.style.display = "block";

                    // Update URL

                    link.href = url;

                }

            });

        }


        // Connect form inputs with preview cards

        updateLink(
            "instagramInput",
            "instagramLink"
        );

        updateLink(
            "linkedinInput",
            "linkedinLink"
        );

        updateLink(
            "spotifyInput",
            "spotifyLink"
        );

        updateLink(
            "githubInput",
            "githubLink"
        );

    </script>

</body>
</html>
