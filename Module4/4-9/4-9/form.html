<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

        <form method="post">
            <fieldset>
                <legend>Personal Information</legend>
           
            <p>
                Enter Your Full Name:
                <input type="text" name="name"/>
            </p>

             <p>
                Enter Your Mobile:
                <input type="number" name="mob"/>
            </p>
            
             <p>
                Enter Your Password:
                <input type="password" name="pass"/>
            </p>
 </fieldset>
 <fieldset>
    <legend>Work Information</legend>
             <p>
                Choose Your City:
                <select>
                    <option>Rajkot</option>
                    <option>Ahmedabad</option>
                    <option>Baroda</option>
                    <option>Surat</option>
                </select>    
            </p>

             <p>
                Choose your hobbies:
                <input type="checkbox" name="cricket" value="cricket">Cricket
                <input type="checkbox" name="Football" value="Football">Football
                <input type="checkbox" name="Vollyball" value="Vollyball">Vollyball
                <input type="checkbox" name="XYZ" value="XYZ">XYZ
            </p>

            <p>
                Select Your Gender:
                <input type="radio" name="gender">Male
                <input type="radio" name="gender">Female
            </p>

            <p>
                <input type="submit" value="submit">
                <input type="reset" value="reset">
            </p>

</fieldset>

        </form>
    
</body>
</html>
